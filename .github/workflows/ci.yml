name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Fake but present -- config.py raises at import time if these are
      # missing, and nothing in this job talks to a real Groq/Supabase
      # instance (chat.py's client and tools.py's DB/web calls are all
      # mocked in tests/, see tests/conftest.py).
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      GROQ_API_KEY: ci-placeholder-groq-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Placeholder URL is enough here -- this step exists to catch build
        # failures (missing modules, bad imports, broken pages), not to
        # validate connectivity to a real backend.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build