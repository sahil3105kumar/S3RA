[project]
name = "backend"
version = "0.1.0"
description = "S3RA FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.15.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = []