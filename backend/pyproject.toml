[project]
name = "backend"
version = "0.1.0"
description = "S3RA FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.15.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "huggingface-hub>=0.27.0",
    "tokenizers>=0.21.0", 
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py and everything it imports uses bare imports (e.g. `from config
# import ...`) relative to backend/ as the working root -- this makes sure
# pytest resolves those the same way regardless of the directory CI (or a
# person) happens to invoke it from.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]